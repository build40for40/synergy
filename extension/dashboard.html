<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synergy</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="top">
    <h1 id="title"><span class="mark" aria-hidden="true"></span><span id="title-text">Synergy</span></h1>
    <nav class="nav" aria-label="Views">
      <span id="date" class="date"></span>
      <button type="button" class="link" data-go="today" id="nav-today">Today</button>
      <button type="button" class="link" data-go="history" id="nav-history">History</button>
      <button type="button" class="link" data-go="settings" id="nav-settings">Settings</button>
    </nav>
  </header>
  <main id="view" aria-live="polite"></main>
  <script src="dashboard.js" type="module"></script>
</body>
</html>
