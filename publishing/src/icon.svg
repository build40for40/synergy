<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Synergy monogram (card 173): an italic S over a serif Y, ringed by an ivory and champagne gold
       yin-yang on deep sage. The letters are Cormorant Garamond 600; render with that font loaded. -->
  <circle cx="60" cy="60" r="55" fill="#050608" stroke="#bea26a" stroke-width="1.6"/>
  <circle cx="60" cy="60" r="44" fill="#26332b"/>
  <path d="M60 10 A50 50 0 0 1 60 110 A44 44 0 0 0 60 22 Z" fill="#bea26a"/>
  <path d="M60 110 A50 50 0 0 1 60 10 A44 44 0 0 0 60 98 Z" fill="#f2eee6"/>
  <text x="58" y="88" text-anchor="middle" font-family="'Cormorant Garamond', Garamond, serif" font-weight="600" font-size="74" fill="#bea26a">Y</text>
  <text x="63" y="86" text-anchor="middle" font-family="'Cormorant Garamond', Garamond, serif" font-style="italic" font-weight="600" font-size="80" fill="#f2eee6" stroke="#26332b" stroke-width="5" paint-order="stroke">S</text>
</svg>
