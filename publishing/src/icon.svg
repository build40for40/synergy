<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Synergy mark in The Ledger (card 173), the same drawing as the site's /synergy/icon.svg: an italic
       Bodoni S inside a double engraved oval, ultramarine on cream paper. Render with Bodoni Moda loaded
       (extension/fonts). The 16px icon drops the inner oval and thickens the outer one so it stays legible. -->
  <rect width="64" height="64" rx="10" fill="#efe7d6"/>
  <ellipse cx="32" cy="32" rx="27" ry="20" fill="none" stroke="#2338a8" stroke-width="2.6"/>
  <ellipse cx="32" cy="32" rx="22.5" ry="15.5" fill="none" stroke="#2338a8" stroke-width="1.2"/>
  <text x="32" y="44" text-anchor="middle" font-family="'Bodoni Moda', Didot, 'Bodoni 72', serif" font-style="italic" font-size="34" fill="#2338a8">S</text>
</svg>
