<title>Synergy Daily Ten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap">
<style>
/* Layout: state tabs on top, one phone-sized Chrome side panel in the middle, a short note on that state beside it.
   Skin: Ben's Synergy boat club (card 173). Walnut changing room by default, parchment when the device is in light mode.
   Colour values are the standard ones for the names on card 173; swap in Ben's exact values once his draft is shared.
   Token roles: --lime = the action colour (brass), --pink = claret, --yellow = gilt. Names kept so the rest of the CSS is unchanged. */
:root {
  --page: #24160d; --phone: #3a2414; --tile: #4a2f1b; --line: #5f3e24; --edge: #8a6a3a;
  --text: #f3ead3; --sub: #dccfae; --muted: #b39f78;
  --lime: #c9a227; --lime-ink: #1c140c; --yellow: #e0c068; --pink: #d0607a;
  --squiggle: #e0c068; --club: #1f5a3a; --club-ink: #f3ead3;
  --s-msg: #a9bde0; --s-call: #7cc495; --s-rej: #e07a92;
  --logo-a: #a6e22e; --logo-b: #ffd400; --logo-c: #ff7fcf;
  --grain: rgba(0,0,0,.18);
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --serif: "EB Garamond", Garamond, Georgia, serif;
  --script: "Pinyon Script", "Snell Roundhand", cursive;
  --mono: var(--serif);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --page: #e6dabd; --phone: #f6efdc; --tile: #fbf6e8; --line: #dccdaa; --edge: #a8894a;
  --text: #1b1b1f; --sub: #3f3528; --muted: #6b5c44;
  --lime: #7d5f0e; --lime-ink: #fbf6e8; --yellow: #7d5f0e; --pink: #7f1734;
  --squiggle: #7d5f0e; --club: #004225; --club-ink: #f6efdc;
  --s-msg: #1d3461; --s-call: #004225; --s-rej: #7f1734;
  --logo-a: #4f7a0a; --logo-b: #b88f00; --logo-c: #c2408f;
  --grain: rgba(90,60,20,.06);
  color-scheme: light; } }
:root[data-theme="light"] {
  --page: #e6dabd; --phone: #f6efdc; --tile: #fbf6e8; --line: #dccdaa; --edge: #a8894a;
  --text: #1b1b1f; --sub: #3f3528; --muted: #6b5c44;
  --lime: #7d5f0e; --lime-ink: #fbf6e8; --yellow: #7d5f0e; --pink: #7f1734;
  --squiggle: #7d5f0e; --club: #004225; --club-ink: #f6efdc;
  --s-msg: #1d3461; --s-call: #004225; --s-rej: #7f1734;
  --logo-a: #4f7a0a; --logo-b: #b88f00; --logo-c: #c2408f;
  --grain: rgba(90,60,20,.06);
  color-scheme: light; }
:root[data-theme="dark"] {
  --page: #24160d; --phone: #3a2414; --tile: #4a2f1b; --line: #5f3e24; --edge: #8a6a3a;
  --text: #f3ead3; --sub: #dccfae; --muted: #b39f78;
  --lime: #c9a227; --lime-ink: #1c140c; --yellow: #e0c068; --pink: #d0607a;
  --squiggle: #e0c068; --club: #1f5a3a; --club-ink: #f3ead3;
  --s-msg: #a9bde0; --s-call: #7cc495; --s-rej: #e07a92;
  --logo-a: #a6e22e; --logo-b: #ffd400; --logo-c: #ff7fcf;
  --grain: rgba(0,0,0,.18);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.45;
  padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

.top { max-width: 900px; margin: 0 auto 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.logo { font-weight: 800; letter-spacing: -0.02em; font-size: 16px; }
.logo .a { color: var(--logo-a); } .logo .b { color: var(--logo-b); } .logo .c { color: var(--logo-c); }
.logo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.logo small { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 6px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs a { text-decoration: none; color: var(--sub); font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--edge); }
.tabs a[aria-current="page"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); font-weight: 700; }
.tabs a:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

.stage { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; max-width: 900px; margin: 0 auto; }

/* Phone */
.phone { width: 100%; max-width: 375px; min-height: 640px; background: var(--phone); border: 1px solid var(--edge); border-radius: 36px; padding: 14px 14px 18px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); }
.island { width: 96px; height: 26px; border-radius: 20px; background: var(--page); margin: 0 auto 14px; border: 1px solid var(--line); }
.head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 12px; }
.head h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
.head .date { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.sublbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: 14px 4px 6px; display: flex; justify-content: space-between; }

/* Market feedback banner */
.alert { display: flex; gap: 10px; align-items: center; background: color-mix(in oklab, var(--s-call) 14%, var(--tile)); border: 1px solid var(--s-call); border-radius: 12px; padding: 10px 12px; margin-bottom: 4px; }
.alert b { color: var(--s-call); }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s-call); flex: none; }

ul.leads { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lead { background: var(--tile); border: 1px solid var(--line); border-radius: 14px; }
.lead.done .rowwrap { opacity: .55; }
.rowwrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.row { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; width: 100%; padding: 10px 4px 10px 12px; background: none; border: 0; text-align: left; cursor: pointer; border-radius: 14px; min-width: 0; }
.who { min-width: 0; }
.name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.new-dot { font-size: 9px; font-weight: 700; color: var(--pink); letter-spacing: .06em; flex: none; }
.meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta b { color: var(--sub); font-weight: 500; }

/* Tier: signal bars */
.sig { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
.sig span { width: 5px; border-radius: 1px; background: var(--edge); }
.sig span:nth-child(1) { height: 6px; } .sig span:nth-child(2) { height: 11px; } .sig span:nth-child(3) { height: 16px; }
.sig[data-s="3"] span, .sig[data-s="2"] span:nth-child(-n+2), .sig[data-s="1"] span:nth-child(1) { background: var(--lime); }

/* Sent: the daily yes/no */
.sent { margin-right: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; border-radius: 999px; border: 1.5px dashed var(--edge); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
.sent:hover { border-color: var(--s-msg); color: var(--s-msg); }
.sent[aria-pressed="true"] { border-style: solid; border-color: var(--s-msg); background: var(--s-msg); color: var(--phone); }

/* Status pills */
.pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px 3px 7px; border-radius: 999px; border: 1px solid currentColor; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; margin-right: 12px; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
[data-st="msg"] { color: var(--s-msg); } [data-st="call"] { color: var(--s-call); } [data-st="rej"] { color: var(--s-rej); } [data-st="nore"], [data-st="nope"] { color: var(--muted); } [data-st="quiet"] { color: var(--squiggle); }
.lead.is-rej .name, .lead.is-nope .name { text-decoration: line-through; color: var(--muted); }

/* Detail */
.more { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 10px; padding: 2px 8px; border-radius: 6px; background: var(--phone); border: 1px solid var(--line); color: var(--sub); }
.chip.trig { border-color: var(--squiggle); color: var(--squiggle); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); margin: 0; }
.stats div { background: var(--phone); padding: 6px 8px; min-width: 0; }
.stats dt { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12px; }
.why { color: var(--sub); font-size: 12px; margin: 0; }
.outcome { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.outcome button { font-size: 10px; font-weight: 700; padding: 7px 0; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; text-transform: uppercase; letter-spacing: .04em; }
.outcome button[aria-pressed="true"] { border-color: currentColor; background: color-mix(in oklab, currentColor 14%, transparent); }

.squig { position: relative; padding: 14px 14px 12px; }
.squig svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.squig rect { fill: none; stroke: var(--squiggle); stroke-width: 1.6; }
.squig p { margin: 0; font-size: 11.5px; white-space: pre-wrap; position: relative; }
.squig .copy { position: relative; margin-top: 10px; font-size: 11px; font-weight: 700; padding: 6px 12px; border: 0; border-radius: 8px; background: var(--lime); color: var(--lime-ink); cursor: pointer; }
.squig .tag { position: absolute; top: -8px; left: 12px; background: var(--tile); padding: 0 6px; font-size: 9px; color: var(--squiggle); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }

/* Onboarding */
.steps { display: flex; gap: 6px; padding: 0 4px 16px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--lime); }
.ob { padding: 0 4px; display: flex; flex-direction: column; gap: 14px; }
.ob h2 { font-size: 18px; margin: 0; letter-spacing: -0.02em; }
.ob p { margin: 0; color: var(--sub); }
.btn { border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 700; cursor: pointer; background: var(--lime); color: var(--lime-ink); width: 100%; }
.btn.ghost { background: transparent; color: var(--sub); border: 1px solid var(--edge); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.soon { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px dashed var(--edge); border-radius: 10px; padding: 10px 12px; color: var(--muted); }
.soon span:last-child { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; border: 1px solid var(--edge); border-radius: 999px; padding: 2px 8px; flex: none; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .field .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.field input, .field select { font: inherit; font-size: 13px; color: var(--text); background: var(--tile); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { font-size: 11px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--edge); background: transparent; color: var(--sub); cursor: pointer; }
.toggles button[aria-pressed="true"] { border-color: var(--lime); color: var(--lime); }
.toggles button[disabled] { cursor: not-allowed; opacity: .6; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.done-mark { color: var(--lime); font-weight: 700; }

/* Side note */
.spec { flex: 1 1 260px; max-width: 380px; color: var(--sub); padding-top: 8px; }
.spec h2 { font-size: 22px; color: var(--text); margin: 0 0 8px; letter-spacing: -0.02em; text-wrap: balance; }
.spec h3 { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin: 20px 0 8px; }
.spec p { margin: 0 0 8px; }
.spec ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; }
.note { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 24px; }

/* Any replies? */
.ask { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--s-msg); background: color-mix(in oklab, var(--s-msg) 10%, var(--tile)); cursor: pointer; text-align: left; margin-bottom: 4px; }
.ask b { color: var(--s-msg); }
.ask .n { font-size: 11px; color: var(--muted); }
.replies { list-style: none; margin: 0 0 4px; padding: 4px 12px 10px; border: 1px solid var(--s-msg); border-top: 0; border-radius: 0 0 12px 12px; margin-top: -8px; display: flex; flex-direction: column; gap: 10px; background: var(--tile); }
.replies li { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.replies li:first-child { border-top: 0; }
.replies .nm { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.replies .nm span { font-weight: 400; font-size: 11px; color: var(--muted); white-space: nowrap; }
.replies .nm span.q { color: var(--squiggle); }
.alert.warn { background: color-mix(in oklab, var(--squiggle) 12%, var(--tile)); border-color: var(--squiggle); }
.alert.warn b { color: var(--squiggle); } .alert.warn .dot { background: var(--squiggle); }
.alert.err { background: color-mix(in oklab, var(--s-rej) 12%, var(--tile)); border-color: var(--s-rej); }
.alert.err b { color: var(--s-rej); } .alert.err .dot { background: var(--s-rej); }

/* Not for me */
.nope-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reasons button { font-size: 10px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--edge); background: transparent; color: var(--sub); cursor: pointer; }
.reasons button[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
.unk { color: var(--squiggle); }
.hint { font-size: 11px; color: var(--muted); margin: 0; }

/* Carried over + streak */
.from { font-size: 9px; font-weight: 700; color: var(--squiggle); letter-spacing: .06em; flex: none; }
.streak { display: flex; align-items: center; gap: 10px; padding: 0 4px 10px; font-size: 11px; color: var(--muted); }
.streak b { color: var(--lime); }
.streak .dots { display: flex; gap: 3px; }
.streak .dots i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
.streak .dots i.on { background: var(--lime); }
.welldone { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 12px; background: var(--lime); color: var(--lime-ink); margin-bottom: 4px; }
.welldone b { font-size: 15px; }
.welldone span { font-size: 12px; }

/* Head gear */
.head .r { display: flex; gap: 10px; align-items: baseline; }
.gear { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--muted); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }

/* Loading */
.skel { height: 52px; border-radius: 14px; background: var(--tile); border: 1px solid var(--line); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

/* Empty / weekly */
.empty { border: 1px dashed var(--edge); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.empty p { margin: 0; color: var(--sub); }
.funnel { display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
.frow { display: grid; grid-template-columns: 92px 1fr 28px; gap: 10px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.frow .track { height: 12px; background: var(--line); border-radius: 3px; overflow: hidden; }
.frow .fill { height: 100%; background: var(--lime); border-radius: 3px; }
.frow b { text-align: right; }
.wk { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 0 4px; }
.wk div { text-align: center; font-size: 10px; color: var(--muted); }
.wk i { display: block; height: 28px; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 4px; }
.wk i.y { background: var(--lime); border-color: var(--lime); }
.wk i.p { background: color-mix(in oklab, var(--lime) 35%, transparent); }
.suggest { border: 1px solid var(--edge); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin: 0 4px; }
.suggest .two { gap: 6px; }
.tabgroup { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tabgroup > span { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-right: 4px; }
.tabs { flex-direction: column; align-items: flex-end; gap: 6px; }
@media (max-width: 640px) { .tabs { align-items: flex-start; } }

/* VC lead detail */
.partner { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.partner .lbl { display: block; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.links { display: flex; gap: 4px; }
.links a { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--sub); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; background: var(--phone); }
.links a:hover { border-color: var(--lime); color: var(--lime); }
.links a:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.links svg { width: 13px; height: 13px; flex: none; }
.port { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; background: var(--phone); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.port th { font-size: 9px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.port th:not(:first-child), .port td:not(:first-child) { text-align: right; white-space: nowrap; }
.port td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.port td span { display: block; color: var(--muted); font-size: 10px; }
.port tr.fit td { border-top: 0; padding-top: 0; color: var(--sub); font-size: 10.5px; text-align: left; white-space: normal; }
.port tr.fit td::before { content: "Why now: "; color: var(--squiggle); }
.notes { width: 100%; resize: vertical; font: inherit; font-size: 12px; color: var(--text); background: var(--phone); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.notes::placeholder { color: var(--muted); }
.notes:focus-visible { outline: 2px solid var(--lime); outline-offset: 1px; }
.head .r .gear + .gear { margin-left: -4px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.seg2 button { padding: 8px 0; border-radius: 8px; border: 1px solid var(--edge); background: transparent; color: var(--sub); cursor: pointer; font-size: 12px; }
.seg2 button[aria-pressed="true"] { border-color: var(--lime); background: var(--lime); color: var(--lime-ink); font-weight: 700; }
.group-lbl { font-size: 11px; font-weight: 700; color: var(--text); border-top: 1px solid var(--line); padding-top: 12px; }

/* ---------- Boat club skin (card 173) ---------- */
body { font-family: var(--serif); font-size: 14.5px; font-variant-numeric: lining-nums;
  background-color: var(--page);
  background-image: repeating-linear-gradient(90deg, transparent 0 7px, var(--grain) 7px 8px, transparent 8px 19px, var(--grain) 19px 20px, transparent 20px 41px); }

const D3 = { date:"Mon 9 Nov", today:["l5","l6","l8","l9","l10","l12","l13","l15","l16","l17"], fresh:["l15","l16","l17"], callBanner:true,

/* ---------- Helpers ---------- */
const gbp = n => n == null ? null : "£" + n.toFixed(1) + "m";
const tier = s => "Tier " + (4 - s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const OUT = { msg:"Waiting", call:"Call", rej:"Rejected", nore:"No reply", nope:"Not for me" };
/* Notes per lead, kept across tabs. Two examples so the field reads as real. */
const NOTES = { l1:"Met Helen at the BVCA dinner in 2024. Call booked for Tue 10am.", l11:"Nadia prefers WhatsApp. Ask about Sable first." };
const REASONS = ["Portfolio too young","Wrong sector","Bad timing","Know them already"];
const SPORTS = ["Tennis","Basketball","Fencing","Baseball","Football","Cricket","Golf"];
const YEAR = 2026;
/* Client kept anonymous: the prompt shows [Your name] / [Your firm] until he fills them in. */
const profile = { name:"", company:"", get n() { return this.name || "[Your name]"; }, get c() { return this.company || "[Your firm]"; },
  offer:"I help boards and founders of profitable, VC-backed companies plan their exit: a sale, a secondary or a buy-out." };
const params = { perDay:"10", terr:["UK","Second territory"], sectors:["Business services"], fundAge:"7", ebitda:"1", noRaise:"5", stage:"Series A+" };
const N = () => +params.perDay;

const margin = p => p.ebitda == null ? null : Math.round(p.ebitda / p.rev * 100);
/* One line of evidence per company: the numbers, then the specific reason it fits an exit now. */
const evidence = p => `- ${p.n} (${p.sector}): ${gbp(p.rev)} revenue, ${p.ebitda == null ? "EBITDA not public" : `${gbp(p.ebitda)} EBITDA (${margin(p)}% margin)`}, growing ${p.growth}% a year, last raised ${p.last} (${YEAR - p.last} years ago). Why now: ${p.fit}.`;
const prompt = (l, follow) => {
  const best = [...l.m].map(id => P[id]).sort((a, b) => (b.ebitda ?? -1) - (a.ebitda ?? -1))[0];
  if (follow) return `I'm ${profile.n} from ${profile.c}. A week ago I emailed ${l.partner} at ${l.name} about ${best.n} and haven't heard back.
Fact to use: ${best.fit}.
Write a two-sentence follow-up that adds one new, useful point about ${best.n}'s options. No guilt, same ask: a 20-minute call.`;
  return `I'm ${profile.n}, founder of ${profile.c}. ${profile.offer}

Write a short first email to ${l.partner}, partner at ${l.name}. ${l.why}.

Their holdings that fit:
${l.m.map(id => evidence(P[id])).join("\n")}

Why these are a fit: they're profitable and growing on their own cash, so they don't need another venture round, and the fund needs to return money to its investors. That makes them better suited to a sale, a secondary or a buy-out than to a Series C. That's the gap I fill.

Check recent news on ${l.name} and on ${best.n} first, and use one relevant detail. Lead with ${best.n} and say specifically why it fits, using its numbers. Mention the others in one line at most. Peer to peer, under 120 words, no jargon. One ask: a 20-minute call about which of these might want options in the next two years.`;
};

  return `${l.fund} · ${l.vintage} · <b>${l.m.length} ${l.m.length === 1 ? "match" : "matches"}</b>${unk ? ` · <span class="unk">EBITDA unknown</span>` : ""}`;
}
function portfolio(l) {
  return `<table class="port"><thead><tr><th>Matching company</th><th>EBITDA</th><th>Last round</th></tr></thead><tbody>
    ${l.m.map(id => { const p = P[id]; return `<tr><td><b>${esc(p.n)}</b><span>${esc(p.sector)} · rev ${gbp(p.rev)} · +${p.growth}%</span></td>
      <td${p.ebitda == null ? ' class="unk"' : ""}>${p.ebitda == null ? "Unknown" : `${gbp(p.ebitda)}<span>${margin(p)}% margin</span>`}</td><td>${p.last}<span>${YEAR - p.last} yrs</span></td></tr>
      <tr class="fit"><td colspan="3">${esc(p.fit)}</td></tr>`; }).join("")}
  </tbody></table>`;
}
function squig(id, follow) {
  return `<div class="squig">
      <svg aria-hidden="true"><rect x="2" y="2" rx="12" filter="url(#wobble)"/></svg>
      <span class="tag">${follow ? "Follow-up prompt" : "Prompt for Claude"}</span>
      <p id="p-${id}">${esc(prompt(L[id], follow))}</p>
      <button class="copy" data-act="copy" data-id="${id}">Copy prompt</button>
    </div>`;
}
function detail(id, st, play) {
  const l = L[id], quiet = (st.quiet || []).includes(id);
  const anyUnk = l.m.some(x => P[x].ebitda == null);
  let tail;
  if (play && play[1] === "nope") {
    tail = `<p class="hint">Not for me${play[3] ? ` · ${esc(play[3])}` : ""}</p>`;
  } else if (play) {
    tail = `<div class="outcome" style="grid-template-columns:repeat(4,1fr)" role="group" aria-label="What happened with ${esc(l.name)}">
      ${["msg","call","rej","nore"].map(k => `<button data-act="out" data-id="${id}" data-st="${k}" aria-pressed="${play[1]===k}">${OUT[k]}</button>`).join("")}
    </div>`;
  } else {
    const n = st.nope[id];
    tail = n === undefined
      ? `<div class="nope-row"><button class="link" data-act="nope" data-id="${id}">Not for me</button></div>`
      : `<p class="hint">Not for me. Why? Optional, it tunes your search.</p>
         <div class="reasons">${REASONS.map(r => `<button data-act="reason" data-id="${id}" data-r="${r}" aria-pressed="${n===r}">${r}</button>`).join("")}</div>
         <div class="nope-row"><button class="link" data-act="unnope" data-id="${id}">Undo</button></div>`;
  }
  return `<div class="more">
    <div class="chips"><span class="chip">${tier(l.s)}</span><span class="chip trig">${l.trig}</span><span class="chip">${l.city}</span></div>
    <div class="partner"><span><span class="lbl">Contact</span><b>${esc(l.partner)}</b>, partner</span>${links(l)}</div>
    ${portfolio(l)}
    ${anyUnk ? `<p class="hint">Unknown = not in Dealroom. Check Companies House.</p>` : ""}
    <p class="why">${esc(l.why)}</p>
    <div class="field"><label for="note-${id}">Notes</label><textarea class="notes" id="note-${id}" data-id="${id}" rows="2" placeholder="Who knows them, what they said, when to chase">${esc(NOTES[id] || "")}</textarea></div>
    ${play ? tail + (play[1] === "nope" ? "" : squig(id, quiet)) : squig(id) + tail}
  </div>`;
}
function leadRow(id, st) {
  const l = L[id], isOpen = open === id, sent = st.sent.includes(id), nope = st.nope[id] !== undefined;
  const right = nope ? `<span class="pill" data-st="nope">Not for me</span>`
    : `<button class="sent" data-act="sent" data-id="${id}" aria-pressed="${sent}" aria-label="Sent to ${esc(l.name)}">${sent ? "Sent ✓" : "Sent?"}</button>`;
  return `<li class="lead${sent ? " done" : ""}${nope ? " is-nope done" : ""}">
    <div class="rowwrap">
      <button class="row" data-act="open" data-id="${id}" aria-expanded="${isOpen}">${SIG(l.s)}
        <span class="who"><span class="name">${esc(l.name)}${st.fresh.includes(id) ? `<span class="new-dot">NEW</span>` : ""}${st.carried?.[id] ? `<span class="from">FROM ${st.carried[id].toUpperCase()}</span>` : ""}</span><span class="meta">${metaLine(l)}</span></span>
      </button>${right}
    </div>
    ${isOpen ? detail(id, st) : ""}
  </li>`;
}
function playRow(item, st) {
  const [id, out, when] = item, l = L[id], isOpen = open === id, quiet = out === "msg" && (st.quiet || []).includes(id);
  return `<li class="lead${out === "rej" || out === "nore" || out === "nope" ? " is-rej" : ""}">
    <div class="rowwrap">
      <button class="row" data-act="open" data-id="${id}" aria-expanded="${isOpen}">${SIG(l.s)}
        <span class="who"><span class="name">${esc(l.name)}${NOTES[id] ? `<span class="from" title="Has notes">✎</span>` : ""}</span><span class="meta">${esc(l.partner)} · ${out === "nope" ? "shown" : "sent"} ${when}</span></span>
      </button>
      <span class="pill" data-st="${quiet ? "quiet" : out}">${quiet ? "Quiet 7d" : OUT[out]}</span>
    </div>
    ${isOpen ? detail(id, st, item) : ""}
  </li>`;
}
function headHtml(title, date, gear = true) {
  return `<div class="island"></div><div class="head"><h1>${title}</h1><span class="r"><span class="date">${date}</span>${gear ? `${view === "history" ? "" : `<button class="gear" data-act="go" data-v="history">History</button>`}<button class="gear" data-act="go" data-v="search">Settings</button>` : ""}</span></div>`;
}

/* History: every lead he's ever been shown, as of Fri 20 Nov. [id, outcome, when shown/sent, not-for-me reason] */
const HISTORY = [["l1","call","Thu 5"],["l11","call","Fri 6"],["l3","msg","Thu 5"],["l7","msg","Fri 6"],["l15","msg","Wed 18"],["l16","msg","Wed 18"],["l12","msg","Mon 9"],
  ["l2","rej","Thu 5"],["l13","rej","Mon 9"],["l4","nore","Thu 5"],["l14","nore","Fri 6"],["l6","nope","Fri 6","Wrong sector"],["l9","nope","Mon 9","Portfolio too young"]];
const HFILTERS = [["all","All",() => true],["msg","Waiting",o => o === "msg"],["call","Calls",o => o === "call"],["closed","Closed",o => o === "rej" || o === "nore"],["nope","Not for me",o => o === "nope"]];
let hFilter = "all";
function renderHistory() {
  const st = S.history;
  const f = HFILTERS.find(x => x[0] === hFilter);
  const rows = st.inplay.filter(x => f[2](x[1]));
  phone.innerHTML = headHtml("History", "Since 5 Nov") + `
    <div class="toggles" style="padding:0 4px 10px" role="group" aria-label="Filter history">
      ${HFILTERS.map(([k, label, fn]) => `<button data-act="hf" data-v="${k}" aria-pressed="${hFilter===k}">${label} ${st.inplay.filter(x => fn(x[1])).length}</button>`).join("")}
    </div>
    <ul class="leads">${rows.map(x => playRow(x, st)).join("") || `<li class="empty"><p>Nothing here yet.</p></li>`}</ul>`;
  sizeSquiggles();
}

function renderDay(key) {
  const st = S[key], n = N();
  const today = st.today.slice(0, n);
  const order = { call:0, msg:1, rej:2, nore:3 };
  const play = [...st.inplay].sort((a, b) => order[a[1]] - order[b[1]]);
  const waiting = st.inplay.filter(x => x[1] === "msg");
  const quietN = waiting.filter(x => (st.quiet || []).includes(x[0])).length;
  const calls = st.callBanner ? st.inplay.filter(x => x[1] === "call") : [];
  const sentToday = today.filter(id => st.sent.includes(id)).length;
  const handled = today.filter(id => st.sent.includes(id) || st.nope[id] !== undefined).length;
  const allDone = handled === today.length;
  const streakNow = st.streak + (allDone ? 1 : 0);
  let h = headHtml(`Your ${n}`, st.date);
  if (streakNow || st.best) h += `<div class="streak" aria-label="Streak">
      <span class="dots">${Array.from({length:10}, (_, i) => `<i class="${i < Math.min(streakNow, 10) ? "on" : ""}"></i>`).join("")}</span>
      <span>${streakNow ? `<b>${streakNow}-day streak</b>` : "No streak yet"}${st.best && st.best >= streakNow ? ` · best ${st.best}` : ""}</span></div>`;
  if (st.missed) h += `<div class="alert warn"><span class="dot"></span><span><b>Missed ${st.missed}</b> · those leads are still here. Do them today to start a new streak.</span></div>`;
  if (allDone) h += `<div class="welldone"><b>That's your ${n}.</b><span>${streakNow >= 10 ? `${streakNow} days in a row. That's ${streakNow * n} VCs. Nobody else is doing this.` : streakNow > 1 ? `${streakNow} days in a row${streakNow > st.best ? ", your best yet" : ""}. Same again tomorrow.` : "Day one of a streak. Same again tomorrow."}</span></div>`;
  if (st.err) h += `<div class="alert err"><span class="dot"></span><span><b>Can't reach Dealroom</b> · showing yesterday's list. Your ticks still save.</span></div>`;
  h += calls.map(c => `<div class="alert"><span class="dot"></span><span><b>Call requested</b> · ${esc(L[c[0]].partner)}, ${esc(L[c[0]].name)}</span></div>`).join("");
  if (waiting.length) {
    h += `<button class="ask" data-act="replies" aria-expanded="${repliesOpen}"><span><b>Any replies?</b></span><span class="n">${waiting.length} waiting${quietN ? ` · <span class="unk">${quietN} quiet a week</span>` : ""} ${repliesOpen ? "▴" : "▾"}</span></button>`;
    if (repliesOpen) h += `<ul class="replies">${waiting.map(([id,, when]) => {
      const q = (st.quiet || []).includes(id);
      return `<li><span class="nm">${esc(L[id].partner)} · ${esc(L[id].name)}<span class="${q ? "q" : ""}">${q ? "7 days" : "Sent " + when}</span></span>
        <div class="outcome" role="group" aria-label="Reply from ${esc(L[id].partner)}">
          ${["call","rej","nore"].map(k => `<button data-act="out" data-id="${id}" data-st="${k}" aria-pressed="false">${OUT[k]}</button>`).join("")}
        </div></li>`; }).join("")}</ul>`;
  }
  h += `<div class="sublbl"><span>Today</span><span>${handled ? `${sentToday} sent · ${today.length - handled} to go` : ""}</span></div>
    <ul class="leads">${today.map(id => leadRow(id, st)).join("")}</ul>`;
  if (st.empty) h += `<div class="empty"><p>That's every VC that matches your search. Widen it to see more tomorrow.</p><button class="btn ghost" data-act="go" data-v="search">Change search</button></div>`;
  if (play.length) h += `<div class="sublbl"><span>In play</span><span>${play.length}</span></div><ul class="leads">${play.map(x => playRow(x, st)).join("")}</ul>`;
  phone.innerHTML = h;
  sizeSquiggles();
}

function aboutFields() {
  return `<div class="field"><label for="ob-name">Name</label><input id="ob-name" placeholder="Your name" value="${esc(profile.name)}"></div>
    <div class="field"><label for="ob-co">Firm</label><input id="ob-co" placeholder="Your firm" value="${esc(profile.company)}"></div>
    <div class="field"><label for="ob-offer">What you offer</label><input id="ob-offer" value="${esc(profile.offer)}"></div>`;
}
function searchFields() {
  const sel = (id, key, opts, fmt) => `<select id="${id}">${opts.map(v => `<option value="${v}"${params[key]===v?" selected":""}>${fmt(v)}</option>`).join("")}</select>`;
  const tog = (k, opts) => `<div class="toggles">${opts.map(t => `<button data-act="tog" data-k="${k}" data-v="${t}" aria-pressed="${params[k].includes(t)}">${t}</button>`).join("")}</div>`;
  return `<div class="field"><span class="lbl">Leads a day</span>
      <div class="seg2" role="group" aria-label="Leads a day">${["5","10"].map(v => `<button data-act="perday" data-v="${v}" aria-pressed="${params.perDay===v}">${v} a day</button>`).join("")}</div></div>
    <div class="group-lbl">The VC</div>
    <div class="field"><span class="lbl">Territory</span>${tog("terr", ["UK","Second territory"])}</div>
    <div class="field"><label for="ob-fundage">Fund at least</label>${sel("ob-fundage","fundAge",["0","5","7","10"],v=>v==="0"?"Any age":`${v} years old`)}</div>
    <div class="group-lbl">Their portfolio companies</div>
    <div class="field"><span class="lbl">Sector</span>${tog("sectors", ["Business services","Healthcare","Software","Industrials"])}</div>
    <div class="two">
      <div class="field"><label for="ob-ebitda">Min EBITDA</label>${sel("ob-ebitda","ebitda",["0.5","1","1.5","2","5"],v=>`£${v}m`)}</div>
      <div class="field"><label for="ob-raise">No round in</label>${sel("ob-raise","noRaise",["3","4","5","7"],v=>`${v}+ years`)}</div>
    </div>`;
}
const LATER_THEME = `<div class="soon" style="flex-direction:column;align-items:stretch">
    <div style="display:flex;justify-content:space-between;align-items:center"><span>Pick a theme</span><span>Later</span></div>
    <div class="toggles">${SPORTS.map(t => `<button disabled>${t}</button>`).join("")}</div></div>`;

function renderOnboarding() {
  const steps = `<div class="steps" aria-label="Step ${obStep + 1} of 3">${[0,1,2].map(i => `<i class="${i <= obStep ? "on" : ""}"></i>`).join("")}</div>`;
  let body = "";
  if (obStep === 0) body = `<h2>Welcome to Synergy</h2><p>The VCs sitting on companies ready for an exit, a few every morning.</p>
    <button class="btn" data-act="next">Sign in with Google</button>
    <div class="soon"><span>Connect LinkedIn</span><span>Later</span></div>`;
  if (obStep === 1) body = `<h2>About you</h2><p>Used to write your emails.</p>${aboutFields()}${LATER_THEME}<button class="btn" data-act="next">Next</button>`;
  if (obStep === 2) body = `<h2>Who you're looking for</h2>${searchFields()}<button class="btn" data-act="go" data-v="loading">Find my leads</button>`;
  phone.innerHTML = `<div class="island"></div>${steps}<div class="ob">${body}${obStep > 0 ? `<button class="btn ghost" data-act="back">Back</button>` : ""}</div>`;
}
function renderLoading() {
  phone.innerHTML = headHtml(`Your ${N()}`, "Thu 5 Nov", false) +
    `<p class="hint" style="padding:0 4px 10px">Searching Dealroom: VCs in ${params.terr.join(" + ")}, funds ${params.fundAge}+ years old, holding ${params.sectors.join(", ").toLowerCase()} companies with £${params.ebitda}m+ EBITDA and no round in ${params.noRaise}+ years</p>
     <div style="display:flex;flex-direction:column;gap:6px">${Array.from({length:N()}, () => `<div class="skel"></div>`).join("")}</div>
     <button class="btn ghost" style="margin-top:12px" data-act="go" data-v="day-1">Skip to the list</button>`;
}
function renderSettings() {
  phone.innerHTML = headHtml("Settings", "", false) + `<div class="ob">
    <button class="link" style="align-self:flex-start" data-act="go" data-v="day-1">← Back to your leads</button>
    <h2>Who you're looking for</h2><p class="hint">Changes apply from tomorrow.</p>${searchFields()}
    <h2 style="margin-top:6px">About you</h2>${aboutFields()}
    <div class="soon"><span>Connect LinkedIn</span><span>Later</span></div>${LATER_THEME}
    <button class="btn" data-act="go" data-v="day-1">Save</button></div>`;
}
function renderWeekly() {
  const n = N(), shown = n * 5;
  const F = [["Leads shown",shown],["Sent",Math.round(shown*.62)],["Replied",Math.round(shown*.12)],["Calls",Math.round(shown*.04)],["Agreements",0]];
  const days = [["Mon","p"],["Tue","y"],["Wed","y"],["Thu","y"],["Fri","y"]];
  phone.innerHTML = headHtml("This week", "9–13 Nov") + `
    <div class="streak" style="padding-top:2px"><span class="dots">${Array.from({length:10}, (_, i) => `<i class="${i < 4 ? "on" : ""}"></i>`).join("")}</span><span><b>4-day streak</b> · best 6</span></div>
    <div class="sublbl"><span>Did you do your ${n}?</span><span>4 of 5 days</span></div>
    <div class="wk">${days.map(([d,c]) => `<div><i class="${c}"></i>${d}</div>`).join("")}</div>
    <p class="hint" style="padding:6px 4px 0">Full = all ${n} sent or dismissed. Half = some.</p>
    <div class="sublbl"><span>How far they got</span></div>
    <div class="funnel">${F.map(([k,v]) => `<div class="frow"><span>${k}</span><span class="track"><span class="fill" style="width:${v/shown*100}%"></span></span><b>${v}</b></div>`).join("")}</div>
    <div class="sublbl"><span>Not for me</span><span>7</span></div>
    <div class="suggest">${suggestion === null
      ? `<span>5 of 7 had a <b>portfolio too young</b>. Only show funds 10+ years old?</span><div class="two"><button class="btn" data-act="sugg" data-v="yes">Change it</button><button class="btn ghost" data-act="sugg" data-v="no">Keep 7 years</button></div>`
      : `<span>${suggestion === "yes" ? "Done. Funds 10+ years old from tomorrow." : "Kept at 7 years."}</span>`}</div>`;
}
function renderSpec() {
  const s = SPEC[view];
  spec.innerHTML = `<h2>${s.h}</h2><p>${s.p}</p>
    <h3>What the build needs here</h3><ul>${s.needs.map(x => `<li>${x}</li>`).join("")}</ul>
    <p class="note">Prototype with invented funds, partners and companies. Buttons work, but reset when you switch tab (leads a day is kept).</p>`;
}
function render() {
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.v === view ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  if (view === "onboarding") renderOnboarding();
  else if (view === "loading") renderLoading();
  else if (view === "search") renderSettings();
  else if (view === "weekly") renderWeekly();
  else if (view === "history") renderHistory();
  else renderDay(view);
  renderSpec();
}
function sizeSquiggles() {
  document.querySelectorAll(".squig").forEach(b => {
    const r = b.querySelector("rect"); r.setAttribute("width", Math.max(0, b.clientWidth - 4)); r.setAttribute("height", Math.max(0, b.clientHeight - 4));
  });
}

phone.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, st = S[view];
  switch (b.dataset.act) {
    case "open": open = open === id ? null : id; break;
    case "sent": st.sent = st.sent.includes(id) ? st.sent.filter(x => x !== id) : [...st.sent, id]; break;
    case "nope": st.nope[id] = ""; st.sent = st.sent.filter(x => x !== id); break;
    case "reason": st.nope[id] = st.nope[id] === b.dataset.r ? "" : b.dataset.r; break;
    case "unnope": delete st.nope[id]; break;
    case "out": st.inplay = st.inplay.map(x => x[0] === id ? [id, b.dataset.st, x[2]] : x); break;
    case "replies": repliesOpen = !repliesOpen; break;
    case "next": obStep = Math.min(2, obStep + 1); break;
    case "back": obStep = Math.max(0, obStep - 1); break;
    case "perday": params.perDay = b.dataset.v; break;
    case "hf": hFilter = b.dataset.v; open = null; break;
    case "tog": { const k = b.dataset.k, v = b.dataset.v; params[k] = params[k].includes(v) ? params[k].filter(x => x !== v) : [...params[k], v]; break; }
    case "sugg": suggestion = b.dataset.v; if (suggestion === "yes") params.fundAge = "10"; break;
    case "go": go(b.dataset.v); return;
    case "copy": {
      const el = document.getElementById("p-" + id);
      const ok = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy prompt", 1400); };
      const fb = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected, press ⌘C"; };
      navigator.clipboard ? navigator.clipboard.writeText(el.textContent).then(ok, fb) : fb();
      return;
    }
  }
  render();
  (phone.querySelector(`[data-act="${b.dataset.act}"][data-id="${id}"]`) || phone.querySelector(`[data-act="${b.dataset.act}"][data-v="${b.dataset.v}"]`) || phone.querySelector(`[data-act="open"][data-id="${id}"]`))?.focus();
});
phone.addEventListener("input", e => {
  if (e.target.matches(".notes")) NOTES[e.target.dataset.id] = e.target.value;
});
phone.addEventListener("change", e => {
  const map = { "ob-ebitda":"ebitda", "ob-raise":"noRaise", "ob-fundage":"fundAge" };
  if (map[e.target.id]) params[map[e.target.id]] = e.target.value;
  if (e.target.id === "ob-name") profile.name = e.target.value;
  if (e.target.id === "ob-co") profile.company = e.target.value;
  if (e.target.id === "ob-offer") profile.offer = e.target.value;
});
document.querySelector(".tabs").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault(); go(a.dataset.v);
});
function go(v) {
  try { history.replaceState(null, "", "#" + v); } catch (err) {}
  route(v);
}
function route(forced) {
  const h = typeof forced === "string" ? forced : location.hash.slice(1);
  view = SPEC[h] ? h : "onboarding";
  const base = STATES[view];
  if (base) {
    /* "Two weeks in" leaves a few unsent whichever leads-a-day is picked, so day 10 is one or a few taps away */
    const pre = base.sent ? base.today.slice(0, N()).slice(-Math.max(0, N() - 3)) : [];
    S[view] = { ...structuredClone(base), sent: pre, nope: {} };
  }
  if (view === "history") { S.history = { inplay: structuredClone(HISTORY), quiet: [], sent: [], nope: {} }; hFilter = "all"; }
  open = base?.open || (view === "day-3" ? "l1" : null);
  repliesOpen = view === "day-2" || view === "follow-up";
  suggestion = null;
  if (view === "onboarding") obStep = 0;
  render();
  window.scrollTo?.(0, 0);
}
addEventListener("hashchange", () => route());
addEventListener("resize", sizeSquiggles);
route();
</script>
